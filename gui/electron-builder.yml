appId: com.ai-job-search.desk
productName: Job Search Desk
copyright: (c) 2026 Job Search Desk contributors. MIT License.
asar: true
directories:
  output: release
  buildResources: build
files:
  - "*.mjs"
  - terminal/**/*
  - public/**/*
  - public/dist/**/*
  - package.json
  - preload.cjs
asarUnpack:
  - preload.cjs
  - node_modules/node-pty/**/*
  - "**/*.node"
npmRebuild: true
extraMetadata:
  main: electron-main.mjs
win:
  executableName: JobSearchDesk
  icon: build/icon.png
  target:
    - nsis
    - portable
  artifactName: JobSearchDesk-${version}-win-${arch}.${ext}
# Without its own name the portable exe overwrites the NSIS installer:
# both targets otherwise resolve to JobSearchDesk-<version>-win-<arch>.exe.
portable:
  artifactName: JobSearchDesk-${version}-win-${arch}-portable.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: false
  shortcutName: Job Search Desk
  createDesktopShortcut: always
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  uninstallDisplayName: Job Search Desk ${version}
  include: build/installer.nsh
  # Art rendered by scripts/build-installer-art.mjs from build/src/*.svg.
  # These are electron-builder's default resource names, so the files are
  # found either way; naming them keeps the wiring visible.
  installerIcon: installerIcon.ico
  uninstallerIcon: uninstallerIcon.ico
  installerHeader: installerHeader.bmp
  installerSidebar: installerSidebar.bmp
  uninstallerSidebar: installerSidebar.bmp
mac:
  category: public.app-category.productivity
  icon: build/icon.png
  identity: null
  target:
    - dmg
    - zip
  artifactName: JobSearchDesk-${version}-mac-${arch}.${ext}
dmg:
  title: Job Search Desk
  background: background.png
  iconSize: 128
  window:
    width: 660
    height: 400
  contents:
    - x: 170
      y: 210
      type: file
    - x: 490
      y: 210
      type: link
      path: /Applications
linux:
  category: Office
  icon: icons
  desktop:
    entry:
      Comment: Job search desk that keeps the hunt in a folder on this computer
      Keywords: job;search;cv;resume;application;
  target:
    - AppImage
  artifactName: JobSearchDesk-${version}-linux-${arch}.${ext}
publish:
  provider: github
  owner: iLevyTate
  repo: ai-job-search
